<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>理科図鑑マスター</title><link rel="stylesheet" href="style-v3.css"></head><body><header><div><small>中学1年 理科</small><h1>理科図鑑マスター</h1></div><button id="resetBtn">記録をリセット</button></header><main><section id="home" class="screen active"><div class="hero"><div><span>単元7・8</span><h2>図を見て、体のつくりを覚える</h2><p>教科書に近い図で、バッタ・イカ・アサリの名称を練習します。</p></div><strong id="homeRate">0%</strong></div><div class="preview-grid"><article><img src="svg/grasshopper-textbook.svg" alt="バッタの体のつくり"><h3>バッタ</h3><p>頭・胸・腹、触角、あし、気門</p></article><article><img src="svg/squid-clam-textbook.svg" alt="イカとアサリの体のつくり"><h3>イカ・アサリ</h3><p>外とう膜、えら、入水管、出水管</p></article></div><div class="modes"><button data-mode="study">図を見て答える</button><button data-mode="test">10問テスト</button><button data-mode="review">間違いだけ復習 <b id="wrongCount">0</b></button></div></section><section id="quiz" class="screen"><div class="top"><button id="backBtn">← ホーム</button><b><span id="num">1</span>/<span id="total">1</span></b></div><div class="bar"><i id="barFill"></i></div><article class="question"><span id="tag">節足動物</span><h2 id="questionText"></h2><div id="figure"></div><div id="choices"></div><div id="feedback" hidden></div><button id="nextBtn" hidden>次の問題</button></article></section><section id="result" class="screen"><article class="result-card"><small>RESULT</small><h2>結果</h2><strong id="score">0点</strong><p id="resultText"></p><button id="againBtn">もう一度</button><button id="homeBtn">ホームへ</button></article></section></main><script src="app-v3.js"></script></body></html>
