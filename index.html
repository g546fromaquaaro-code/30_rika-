<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中1理科 図で覚える動物の分類</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">中学1年 理科</p>
      <h1>図で覚える 動物の分類</h1>
    </div>
    <button id="resetProgress" class="ghost-btn">進捗をリセット</button>
  </header>

  <main>
    <section id="homeScreen" class="screen active">
      <div class="hero card">
        <div>
          <span class="badge">単元7・8</span>
          <h2>動物の体のつくりと分類</h2>
          <p>図を見て答える練習と、学校のテストに近い10問テストで仕上げます。</p>
        </div>
        <div class="progress-ring" aria-label="学習進捗">
          <span id="progressPercent">0%</span>
        </div>
      </div>

      <div class="mode-grid">
        <button class="mode-card" data-mode="diagram">
          <div class="mode-icon">図</div>
          <h3>図だけ見て答える</h3>
          <p>名称、分類、体のつくりを図から判断します。</p>
          <span>学習を始める →</span>
        </button>
        <button class="mode-card" data-mode="test">
          <div class="mode-icon">10</div>
          <h3>10問テスト</h3>
          <p>単元7・8からランダム出題。結果と苦手分野を確認できます。</p>
          <span>テストを始める →</span>
        </button>
        <button class="mode-card" data-mode="review">
          <div class="mode-icon">復</div>
          <h3>間違いだけ復習</h3>
          <p>これまで間違えた問題だけを解き直します。</p>
          <span id="reviewCount">0問</span>
        </button>
      </div>

      <section class="stats card">
        <h3>学習記録</h3>
        <div class="stat-grid">
          <div><strong id="answeredStat">0</strong><span>回答数</span></div>
          <div><strong id="correctStat">0</strong><span>正解数</span></div>
          <div><strong id="accuracyStat">0%</strong><span>正答率</span></div>
        </div>
      </section>
    </section>

    <section id="quizScreen" class="screen">
      <div class="quiz-topbar">
        <button id="backHome" class="ghost-btn">← ホーム</button>
        <div class="quiz-status">
          <span id="modeLabel">図問題</span>
          <strong><span id="currentNumber">1</span>/<span id="totalNumber">10</span></strong>
        </div>
      </div>

      <div class="progress-track"><div id="quizProgress"></div></div>

      <article class="question-card card">
        <div class="question-meta">
          <span id="chapterBadge" class="badge">単元7</span>
          <span id="categoryLabel">脊椎動物</span>
        </div>
        <h2 id="questionText">問題文</h2>
        <div id="diagramArea" class="diagram-area"></div>
        <div id="choiceArea" class="choice-area"></div>
        <div id="feedback" class="feedback hidden"></div>
        <div class="question-actions">
          <button id="hintBtn" class="ghost-btn">ヒント</button>
          <button id="nextBtn" class="primary-btn hidden">次の問題</button>
        </div>
      </article>
    </section>

    <section id="resultScreen" class="screen">
      <article class="result-card card">
        <p class="eyebrow">RESULT</p>
        <h2>テスト結果</h2>
        <div class="score-circle"><span id="scoreValue">0</span><small>点</small></div>
        <p id="resultMessage"></p>
        <div id="categoryResults" class="category-results"></div>
        <div class="result-actions">
          <button id="retryBtn" class="primary-btn">もう一度</button>
          <button id="resultHomeBtn" class="ghost-btn">ホームへ</button>
        </div>
      </article>
    </section>
  </main>

  <template id="animalClassDiagram">
    <div class="classification-board">
      <div class="class-card fish">魚類<br><small>えら呼吸</small></div>
      <div class="class-card amphibian">両生類<br><small>子：えら／親：肺</small></div>
      <div class="class-card reptile">は虫類<br><small>肺呼吸</small></div>
      <div class="class-card bird">鳥類<br><small>羽毛・卵生</small></div>
      <div class="class-card mammal">哺乳類<br><small>毛・胎生</small></div>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
